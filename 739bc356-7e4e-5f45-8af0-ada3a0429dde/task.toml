[verifier]
# V-001: neither the verifier nor the agent needs external network. The verifier
# runs the deterministic post-fix test cmd offline; the agent solves under the
# harness full egress block (only LLM API endpoints reachable). Both are "none",
# which seals oracle-solution exfiltration via either the verifier or agent path.
network_mode = "no-network"
timeout_sec = 7200.0

[agent]
network_mode = "no-network"
timeout_sec = 14400.0

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 12288
storage_mb = 12288
gpus = 0

[upstream_provenance]
# P-001: every task is a repackaged public pull request, so origin is "derived"
# and provenance_date is the contamination reasoning boundary - the date the fix
# became public. A model trained before it cannot have memorised the repair.
origin = "derived"
provenance_date = "2026-04-20"
source_kind = "public_repository"
upstream_benchmark = "multi-swe-bench"
upstream_toolchain = "github.com/Ethara-Ai/multi-swe-bench@83e18683062efc1a3ba5693e5c6588c57ac5f095"
license = "NOASSERTION"
modifications = ["harbor-repackage", "rubric-added", "instruction-rewritten"]

[upstream_provenance.source]
# canonical_repo is the host's current identity, which survives renames;
# tests/config.json keeps the name as mined and can therefore go stale.
canonical_repo = "MorAlekss/cli-migration-test-3"
base_commit = "cc663d6385b0933e44c84d9f7815c1942e50b3d8"
